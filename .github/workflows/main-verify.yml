name: main-verify

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SACP_BASE_SHA: ${{ github.event.before }}
  SACP_HEAD_SHA: ${{ github.sha }}
  SACP_MERGE_SHA: ${{ github.sha }}

jobs:
  protocol-validation:
    name: protocol-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite protocol --job protocol-validation --fail-on-skip --json evidence/protocol-validation.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-protocol-validation
          path: evidence/protocol-validation.json

  core-ubuntu-311:
    name: core-ubuntu-3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-ubuntu-311 --fail-on-skip --json evidence/core-ubuntu-311.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-core-ubuntu-311
          path: evidence/core-ubuntu-311.json

  core-ubuntu-312:
    name: core-ubuntu-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-ubuntu-312 --fail-on-skip --json evidence/core-ubuntu-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-core-ubuntu-312
          path: evidence/core-ubuntu-312.json

  core-windows-312:
    name: core-windows-3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-windows-312 --fail-on-skip --json evidence/core-windows-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-core-windows-312
          path: evidence/core-windows-312.json

  integration-langgraph-ubuntu-312:
    name: integration-langgraph-ubuntu-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - run: python -m pip install -r requirements-ci.txt -r requirements-integration.txt
      - run: python scripts/run_tests.py --suite langgraph --job integration-langgraph-ubuntu-312 --fail-on-skip --json evidence/integration-langgraph-ubuntu-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-integration-langgraph-ubuntu-312
          path: evidence/integration-langgraph-ubuntu-312.json

  harness:
    name: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite harness --job harness --fail-on-skip --json evidence/harness.json
      - run: git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-evidence-harness
          path: evidence/harness.json

  main-receipt:
    name: main-receipt
    if: always()
    needs:
      - protocol-validation
      - core-ubuntu-311
      - core-ubuntu-312
      - core-windows-312
      - integration-langgraph-ubuntu-312
      - harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: main-evidence-*
          path: evidence
          merge-multiple: true
      - run: >-
          python scripts/build_ci_receipt.py
          --mode main
          --event "$GITHUB_EVENT_PATH"
          --evidence-dir evidence
          --output receipt/main-receipt.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-receipt-${{ github.run_id }}
          path: receipt/main-receipt.yaml
          if-no-files-found: error
          retention-days: 30
