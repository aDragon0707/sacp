name: pr-ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SACP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  SACP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  SACP_MERGE_SHA: ${{ github.sha }}

jobs:
  protocol-validation:
    name: protocol-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite protocol --job protocol-validation --fail-on-skip --json evidence/protocol-validation.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-protocol-validation
          path: evidence/protocol-validation.json
          if-no-files-found: error
          retention-days: 14

  core-ubuntu-311:
    name: core-ubuntu-3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-ubuntu-311 --fail-on-skip --json evidence/core-ubuntu-311.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-core-ubuntu-311
          path: evidence/core-ubuntu-311.json
          if-no-files-found: error
          retention-days: 14

  core-ubuntu-312:
    name: core-ubuntu-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-ubuntu-312 --fail-on-skip --json evidence/core-ubuntu-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-core-ubuntu-312
          path: evidence/core-ubuntu-312.json
          if-no-files-found: error
          retention-days: 14

  core-windows-312:
    name: core-windows-3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite core --job core-windows-312 --fail-on-skip --json evidence/core-windows-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-core-windows-312
          path: evidence/core-windows-312.json
          if-no-files-found: error
          retention-days: 14

  integration-langgraph-ubuntu-312:
    name: integration-langgraph-ubuntu-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - run: python -m pip install -r requirements-ci.txt -r requirements-integration.txt
      - run: python scripts/run_tests.py --suite langgraph --job integration-langgraph-ubuntu-312 --fail-on-skip --json evidence/integration-langgraph-ubuntu-312.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-integration-langgraph-ubuntu-312
          path: evidence/integration-langgraph-ubuntu-312.json
          if-no-files-found: error
          retention-days: 14

  harness:
    name: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/run_tests.py --suite harness --job harness --fail-on-skip --json evidence/harness.json
      - run: git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-harness
          path: evidence/harness.json
          if-no-files-found: error
          retention-days: 14

  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: >-
          python scripts/check_pr_policy.py
          --base "$SACP_BASE_SHA"
          --head "$SACP_HEAD_SHA"
          --source-ref "$SACP_MERGE_SHA"
          --json evidence/pr-policy.json

  pr-gate:
    name: pr-gate
    if: always()
    needs:
      - protocol-validation
      - core-ubuntu-311
      - core-ubuntu-312
      - core-windows-312
      - integration-langgraph-ubuntu-312
      - harness
      - pr-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/check_pr_gate.py
