name: pr-receipt

on:
  workflow_run:
    workflows: [pr-ci]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  receipt:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: evidence-*
          path: evidence
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Independently attest GitHub jobs and commit identities
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_attestation.py --mode pr
          --event "$GITHUB_EVENT_PATH"
          --evidence-dir evidence
          --output attestation.json
          --normalized-event attested-event.json
          --github-output "$GITHUB_OUTPUT"
      - name: Re-run policy with trusted default-branch code
        if: steps.refs.outputs.merge_sha != ''
        continue-on-error: true
        env:
          SACP_MERGE_SHA: ${{ steps.refs.outputs.merge_sha }}
        run: >-
          python scripts/check_pr_policy.py
          --base "${{ steps.refs.outputs.base_sha }}"
          --head "${{ steps.refs.outputs.head_sha }}"
          --source-ref "${{ steps.refs.outputs.merge_sha }}"
          --json evidence/pr-policy.json
      - name: Build SACP receipt with trusted default-branch code
        if: always()
        run: >-
          python scripts/build_ci_receipt.py
          --mode pr
          --event attested-event.json
          --evidence-dir evidence
          --attestation attestation.json
          --output receipt/pr-receipt.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pr-receipt-${{ github.event.workflow_run.id }}
          path: receipt/pr-receipt.yaml
          if-no-files-found: error
          retention-days: 30
